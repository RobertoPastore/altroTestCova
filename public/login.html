<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi — Cyber Audit Pro</title>
    <link rel="stylesheet" href="/style/style.css">
</head>
<body class="public-page" style="justify-content: center; align-items: center;">
    <div class="container container-sm">
        <div class="text-center mb-2" style="padding-top: 2rem;">
            <a href="/" class="nav-brand"><span class="brand-icon">🛡️</span> Cyber Audit Pro</a>
        </div>
        <div class="glass-card">
            <h2 class="text-center">Accedi alla Dashboard</h2>
            <p class="text-center text-sm">Inserisci le credenziali del tuo account per proseguire.</p>
            <div id="loginAlert" class="alert"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="La tua email lavorativa" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="La tua password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 0.5rem;">
                    <span class="btn-text">Accedi</span>
                    <span class="loader" id="loginLoader"></span>
                </button>
            </form>
            <div class="text-center mt-1">
                <p class="text-sm text-muted">Non hai un account? <a href="/register.html" style="color: var(--primary);">Registra la tua Azienda</a></p>
            </div>
        </div>
    </div>
    <footer class="footer"><p>© 2026 Cyber Audit Pro</p></footer>
    <script src="/script/script.js"></script>
</body>
</html>
