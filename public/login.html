<!DOCTYPE html>
<html class="dark" lang="it">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Accedi — Cyber Audit Pro</title>
    <!-- Tailwind CDN & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind Config & Custom CSS -->
    <script src="/script/tailwind-setup.js"></script>
    <link rel="stylesheet" href="/style/style.css">
</head>
<body class="font-body-md text-body-md antialiased min-h-screen flex items-center justify-center relative overflow-x-hidden">
    <!-- Decorative background glow -->
    <div class="absolute top-[20%] left-[50%] -translate-x-1/2 w-[60%] h-[60%] bg-primary-container/10 blur-[150px] rounded-full pointer-events-none -z-10"></div>

    <div class="w-full max-w-[420px] px-4 flex flex-col gap-6 relative z-10">
        
        <div class="text-center mb-2">
            <a href="/" class="inline-flex items-center justify-center gap-2 text-on-surface hover:text-primary transition-colors text-xl font-bold">
                <span class="material-symbols-outlined text-primary-container">shield</span>
                Cyber Audit Pro
            </a>
        </div>

        <div class="glass-card rounded-xl p-8 flex flex-col gap-6">
            <div class="text-center">
                <h2 class="font-headline-md text-headline-md text-on-surface">Accedi alla Dashboard</h2>
                <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Inserisci le credenziali del tuo account per proseguire</p>
            </div>

            <!-- Div utilizzato da script.js per mostrare errori -->
            <div id="loginAlert" class="hidden p-3 rounded-xl font-body-sm text-body-sm bg-error-container/20 border border-error-container/50 text-error-container text-center"></div>

            <form id="loginForm" class="flex flex-col gap-4">
                <div class="flex flex-col gap-1.5">
                    <label for="loginEmail" class="font-label-md text-label-md text-on-surface-variant">Email Lavorativa</label>
                    <input type="email" id="loginEmail" class="w-full bg-surface-container border border-white/10 rounded-full px-4 py-2.5 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/50 transition-all font-body-sm" placeholder="operator@azienda.com" required>
                </div>
                
                <div class="flex flex-col gap-1.5">
                    <label for="loginPassword" class="font-label-md text-label-md text-on-surface-variant">Password</label>
                    <input type="password" id="loginPassword" class="w-full bg-surface-container border border-white/10 rounded-full px-4 py-2.5 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/50 transition-all font-body-sm" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary w-full py-3 rounded-full mt-2 font-label-md text-label-md flex justify-center items-center gap-2">
                    <span class="btn-text">Accedi</span>
                    <span class="material-symbols-outlined text-sm hidden" id="loginLoader" style="animation: spin 1s linear infinite;">sync</span>
                </button>
            </form>

            <div class="text-center mt-2 border-t border-white/5 pt-4">
                <p class="font-body-sm text-body-sm text-on-surface-variant">
                    Non hai un account? 
                    <a href="/register.html" class="text-primary hover:text-primary-fixed transition-colors font-medium">Registra la tua Azienda</a>
                </p>
            </div>
        </div>
    </div>
    <script src="/script/script.js"></script>
</body>
</html>
