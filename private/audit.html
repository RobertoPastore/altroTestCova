<!DOCTYPE html>
<html class="dark" lang="it">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CyberAudit Pro - Audit Assessment</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#e2bfb0",
                        "on-secondary": "#303030",
                        "inverse-surface": "#e5e2e1",
                        "surface-variant": "#353534",
                        "error-container": "#93000a",
                        "on-error": "#690005",
                        "on-primary-fixed": "#351000",
                        "secondary-fixed": "#e4e2e1",
                        "surface-container-low": "#1c1b1b",
                        "secondary-fixed-dim": "#c8c6c5",
                        "primary": "#ffb693",
                        "on-primary-fixed-variant": "#7a3000",
                        "tertiary-fixed": "#e5e2e1",
                        "error": "#ffb4ab",
                        "tertiary": "#c8c6c5",
                        "outline": "#a98a7d",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "outline-variant": "#5a4136",
                        "surface-dim": "#131313",
                        "on-tertiary": "#313030",
                        "on-secondary-fixed-variant": "#474746",
                        "on-primary": "#561f00",
                        "background": "#131313",
                        "on-surface": "#e5e2e1",
                        "secondary-container": "#474746",
                        "secondary": "#c8c6c5",
                        "inverse-primary": "#a04100",
                        "on-secondary-container": "#b6b5b4",
                        "surface-container-high": "#2a2a2a",
                        "surface-container-lowest": "#0e0e0e",
                        "tertiary-container": "#9a9898",
                        "on-background": "#e5e2e1",
                        "on-tertiary-fixed": "#1c1b1b",
                        "surface-bright": "#3a3939",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#ffdbcc",
                        "inverse-on-surface": "#313030",
                        "surface-tint": "#ffb693",
                        "on-primary-container": "#572000",
                        "surface": "#131313",
                        "on-secondary-fixed": "#1b1c1c",
                        "on-tertiary-container": "#313131",
                        "primary-container": "#ff6b00",
                        "primary-fixed-dim": "#ffb693",
                        "surface-container-highest": "#353534",
                        "surface-container": "#201f1f",
                        "on-tertiary-fixed-variant": "#474746"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-desktop": "32px",
                        "gutter": "24px",
                        "container-padding-mobile": "20px",
                        "md": "24px",
                        "base": "8px",
                        "xs": "4px",
                        "xl": "64px",
                        "lg": "40px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "label-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "headline-xl-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"]

                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0F0F0F;
            color: #e5e2e1;
        }
        .glass-panel {
            background: rgba(32, 31, 31, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-shadow {
            box-shadow: 0 0 24px rgba(255, 107, 0, 0.3);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Styling per i nostri radio button originali mappati sullo stile nuovo */
        .custom-radio input[type="radio"] { display: none; }
        .custom-radio label {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px; background-color: #1c1b1b;
            border: 1px solid rgba(255,255,255,0.1); color: #e5e2e1;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 500;
            border-radius: 9999px; width: 100%; white-space: nowrap;
        }
        .custom-radio label::after {
            content: ''; display: block; width: 20px; height: 20px;
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
            margin-left: 24px; transition: all 0.2s;
        }
        .custom-radio input[type="radio"]:checked + label {
            background-color: rgba(255, 182, 147, 0.1); border-color: #ffb693; color: #ffb693;
        }
        .custom-radio input[type="radio"]:checked + label::after {
            background-color: #ffb693; border-color: #ffb693; box-shadow: inset 0 0 0 4px #1c1b1b;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-body-md relative pb-32">
    
    <!-- TopNavBar -->
    <header class="w-full h-20 fixed top-0 left-0 bg-background/80 backdrop-blur-xl border-b border-outline-variant/10 z-40 flex justify-between items-center px-container-padding-desktop">
        <div class="flex items-center gap-sm">
            <button onclick="window.location.href='/private/dashboard_manager.html'" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-container-high transition-colors text-on-surface">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <span class="font-headline-md text-headline-md font-bold text-primary">CyberAudit Pro</span>
        </div>
        <div class="flex items-center gap-md">
            <span class="font-label-md text-label-md text-on-surface-variant">Audit ID: <span id="currentAuditId">---</span></span>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-1 mt-20 pt-lg pb-xl px-container-padding-mobile md:px-container-padding-desktop max-w-5xl mx-auto w-full">
        <!-- Header & Progress -->
        <div class="mb-xl flex flex-col items-center text-center">
            <h1 class="font-headline-xl text-headline-xl text-on-surface mb-sm">Cyber Security Assessment</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl">Valuta l'implementazione e l'efficacia dei controlli di sicurezza logica e fisica attraverso tutti i sistemi aziendali.</p>
        </div>

        <div id="auditAlert" class="hidden p-3 mb-6 rounded-full font-body-sm text-body-sm bg-error-container/20 border border-error-container/50 text-error-container text-center"></div>

        <!-- Question Cards Container -->
        <div id="checklistContainer" class="space-y-md">
            <div class="text-center py-10" id="checklistLoader">
                <span class="material-symbols-outlined text-primary animate-spin text-4xl" style="animation: spin 1s linear infinite;">sync</span>
                <p class="mt-2 text-on-surface-variant font-body-sm text-body-sm">Caricamento checklist in corso...</p>
            </div>
            <!-- Populated by JS -->
        </div>

    </main>

    <!-- Action Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-background/80 backdrop-blur-xl border-t border-outline-variant/10 z-40">
        <div class="max-w-5xl mx-auto w-full p-4 flex justify-between items-center">
            <button id="saveDraftBtn" class="font-label-md text-label-md text-on-surface-variant px-lg py-sm rounded-full hover:bg-surface-container transition-colors flex items-center gap-xs">
                <span class="material-symbols-outlined">save</span> Salva Bozza
            </button>
            <button id="completeAuditBtn" class="font-label-md text-label-md bg-primary text-on-primary px-xl py-md rounded-full hover:bg-primary-container transition-all glow-shadow flex items-center gap-xs">
                Concludi e Genera Report <span class="material-symbols-outlined">assignment_turned_in</span>
            </button>
        </div>
    </div>

    <script src="/private/script/private_script.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => initAuditInterface());</script>
</body>
</html>
