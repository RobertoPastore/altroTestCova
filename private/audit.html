<!DOCTYPE html>
<html class="dark" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esecuzione Audit — Cyber Audit Pro</title>
    <!-- Tailwind CDN & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind Config & Custom CSS -->
    <script src="/script/tailwind-setup.js"></script>
    <link rel="stylesheet" href="/style/style.css">
    
    <style>
        /* Custom Radio for Audit */
        .custom-radio input[type="radio"] {
            display: none;
        }
        .custom-radio label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background-color: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.1);
            color: #e5e2e1;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Geist', sans-serif;
            font-size: 12px;
            font-weight: 500;
            border-radius: 0.25rem;
            white-space: nowrap;
        }
        .custom-radio input[type="radio"]:checked + label.radio-yes {
            background-color: rgba(74, 225, 118, 0.1);
            border-color: #4ae176;
            color: #4ae176;
        }
        .custom-radio input[type="radio"]:checked + label.radio-partial {
            background-color: rgba(255, 102, 0, 0.1);
            border-color: #ff6600;
            color: #ff6600;
        }
        .custom-radio input[type="radio"]:checked + label.radio-no {
            background-color: rgba(255, 180, 171, 0.1);
            border-color: #ffb4ab;
            color: #ffb4ab;
        }
        .custom-radio input[type="radio"]:checked + label.radio-na {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.5);
            color: #ffffff;
        }
    </style>
</head>
<body class="font-body-md text-body-md antialiased bg-surface-container-lowest text-on-surface min-h-screen flex flex-col relative pb-32">

    <!-- Header & Progress -->
    <header class="w-full max-w-container-max mx-auto px-4 md:px-margin-page pt-10 pb-6 sticky top-0 z-30 bg-surface-container-lowest/90 backdrop-blur-md">
        <div class="flex flex-col gap-6">
            <!-- Title Row -->
            <div class="flex justify-between items-end border-b border-white/10 pb-4">
                <div>
                    <a href="/private/dashboard.html" class="inline-flex items-center gap-1 font-label-sm text-label-sm text-primary hover:underline mb-2 uppercase tracking-widest transition-all">
                        <span class="material-symbols-outlined text-sm">arrow_back</span> Torna alla Dashboard
                    </a>
                    <h2 class="font-headline-lg text-headline-lg text-on-surface font-bold">Cyber Security Assessment</h2>
                </div>
                <div class="text-right hidden sm:block">
                    <p class="font-mono-data text-mono-data text-on-surface-variant">Audit ID: <span id="currentAuditId">---</span></p>
                    <p class="font-label-sm text-label-sm text-primary mt-1 px-2 py-0.5 bg-primary/20 rounded uppercase">In Corso</p>
                </div>
            </div>
            <!-- Alert Container -->
            <div id="auditAlert" class="hidden p-3 rounded font-body-sm text-body-sm bg-error-container/20 border border-error-container/50 text-error-container text-center"></div>
        </div>
    </header>

    <!-- Checklist Content -->
    <section class="w-full max-w-container-max mx-auto px-4 md:px-margin-page flex-1 flex flex-col gap-6 mt-4">
        
        <div class="glass-card rounded-lg p-4 border-l-4 border-primary">
            <p class="font-body-sm text-body-sm text-on-surface-variant">
                <strong class="text-primary">Nota bene:</strong> Rispondi a tutte le domande per generare il report di Gap Analysis. Le risposte negative (No) influenzeranno negativamente il punteggio di rischio.
            </p>
        </div>

        <div id="checklistContainer" class="flex flex-col gap-6 mt-4">
            <!-- Loader -->
            <div class="text-center py-10" id="checklistLoader">
                <span class="material-symbols-outlined text-primary animate-spin text-4xl">sync</span>
                <p class="mt-2 text-on-surface-variant font-body-sm text-body-sm">Caricamento checklist in corso...</p>
            </div>
        </div>
        
    </section>

    <!-- Sticky Bottom Bar -->
    <div class="fixed bottom-0 left-0 right-0 glass-popover border-t border-white/10 z-40 bg-surface/80 backdrop-blur-md">
        <div class="w-full max-w-container-max mx-auto px-4 md:px-margin-page py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <button id="saveDraftBtn" class="btn-secondary px-6 py-3 rounded font-label-md text-label-md flex items-center gap-2 w-full sm:w-auto justify-center transition-colors">
                <span class="material-symbols-outlined text-sm">save</span> Salva Bozza
            </button>
            <div class="flex items-center gap-4 w-full sm:w-auto">
                <button id="completeAuditBtn" class="btn-primary px-8 py-3 rounded font-label-md text-label-md flex items-center gap-2 w-full sm:w-auto justify-center transition-transform">
                    Concludi e Genera Report <span class="material-symbols-outlined text-sm">assignment_turned_in</span>
                </button>
            </div>
        </div>
    </div>

    <script src="/private/script/private_script.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => initAuditInterface());</script>
</body>
</html>
